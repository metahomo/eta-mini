name: ci
on:
  pull_request: # PR: 테스트만 (합치기 전에 확인)
  push:
    branches: [main] # main: 테스트만 (합친 결과 확인)
    tags: ["v*"] # v1.0 같은 태그: 테스트 → 이미지 배포
permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04 # 윈도우/macOS도 지원하지만 비용 UP
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # uv.lock 그대로 설치 후 실행 (로컬·VS Code 와 같은 설정)
      - run: uv run --locked pytest -q

  model-gate: # ── 모델 검증 게이트: 기준선보다 낫고 MAE < 2.0분이어야 통과 ──
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # 커밋된 지표 파일을 믿지 않고 코드로 다시 학습해 지표를 새로 만든다 (seed 고정 → 재현 가능)
      - run: uv run --locked python -m training.train_sklearn
      # 조건을 하나라도 못 맞추면 exit 1 → 이 잡이 실패하고 image 잡이 돌지 않는다
      - run: uv run --locked python -m training.validate_model sklearn

  image: # ── 배포: 테스트와 모델 게이트를 통과하면 이미지 빌드·푸시 ────────
    needs: [test, model-gate]
    if: startsWith(github.ref, 'refs/tags/v') # v 로 시작하는 태그를 푸시했을 때만 이미지 배포
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: 이미지 이름 (소문자)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: api/Dockerfile
          push: true
          provenance: false # 단일 플랫폼 매니페스트만 푸시 (attestation 이 붙은 OCI index 를 거부하는 배포 플랫폼 대응)
          sbom: false
          build-args: MODEL_IMPL=rule
          tags: |
            ${{ env.IMAGE }}/eta-api:${{ github.ref_name }}
            ${{ env.IMAGE }}/eta-api:latest
